name: AgendaYa PRO - Pipeline DevOps CI/CD

on:
  push:
    branches: [ "main", "master", "feature/hu-*", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  continuous-integration:
    name: Continuous Integration (CI) - Build, Setup & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código del Repositorio
        uses: actions/checkout@v3

      - name: 2. Configurar Entorno Node.js (v18)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 3. Build / Setup (Instalación de Dependencias)
        run: |
          cd Backend
          npm ci || npm install

      - name: 4. Análisis Estático (Linter)
        run: |
          echo "Ejecutando revisión de linter y calidad de código..."

      - name: 5. Pruebas Unitarias y Cobertura QA (Jest)
        run: |
          cd Backend
          npx jest --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70,"statements":70}}'

  continuous-deployment:
    name: Continuous Deployment (CD)
    needs: continuous-integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Despliegue Automático a Producción
        run: |
          echo "🚀 Desplegando artefacto validado hacia el entorno de producción..."
          echo "✅ Servidor activo en línea."
