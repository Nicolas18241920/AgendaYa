name: CI/CD Pipeline - AgendaYA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-backend:
    name: CI - Testing Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar Pruebas Unitarias
        run: npm test

  check-frontend:
    name: CI - Testing & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar Pruebas Unitarias
        run: npm test
      - name: Validar Compilación
        run: npm run build

  deploy-cd:
    name: CD - Despliegue Continuo
    needs: [check-backend, check-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Desplegar Producción
        run: echo "Despliegue automático completado con éxito en servidor de producción."